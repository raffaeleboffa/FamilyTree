<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f6bed">
<title>Family Tree – Alberi genealogici</title><link rel="icon" type="image/svg+xml" href="logo.svg"><link rel="stylesheet" href="style.css"></head><body>
<!-- Set di icone uniforme (stile a tratto), usato con <use href="#i-nome"> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 22v-6"/><path d="M12 16c-3.6 0-6.5-2.7-6.5-6.2a6.5 6.5 0 0 1 13 0c0 3.5-2.9 6.2-6.5 6.2z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.500-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 18v2h16v-2"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
<symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1"/><path d="M14 10a4 4 0 0 0-5.700 0l-3 3A4 4 0 0 0 11 18.700l1-1"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.400-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
</defs></svg>

<aside id="side">
  <div class="brand"><img class="lgi" src="logo.svg" alt="">Family Tree</div>
  <div class="gt">Albero</div>
  <button data-act="trees"><svg class="i"><use href="#i-folder"/></svg>Alberi</button>
  <button data-act="stats"><svg class="i"><use href="#i-chart"/></svg>Statistiche</button>
  <button data-act="check"><svg class="i"><use href="#i-check"/></svg>Controllo relazioni</button>
  <div class="gt">Strumenti</div>
  <button data-act="settings"><svg class="i"><use href="#i-sliders"/></svg>Impostazioni</button>
  <button data-act="io"><svg class="i"><use href="#i-download"/></svg>Importa / Esporta</button>
  <button data-act="pdf"><svg class="i"><use href="#i-file"/></svg>Esporta PDF</button>
  <button data-act="privacy"><svg class="i"><use href="#i-lock"/></svg>Privacy e dati</button>
  <span class="sp"></span>
  <button data-act="theme"><svg class="i"><use href="#i-theme"/></svg>Tema chiaro / scuro</button>
</aside>

<main>
<header id="top">
  <span class="bm"><img class="lgi" src="logo.svg" alt="">Family Tree</span>
  <button class="pri dk" data-act="add"><svg class="i"><use href="#i-plus"/></svg>Persona</button>
  <div class="grp">
    <button class="ib" data-act="undo" title="Annulla (Ctrl+Z)" aria-label="Annulla"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ib" data-act="redo" title="Ripristina (Ctrl+Y)" aria-label="Ripristina"><svg class="i"><use href="#i-redo"/></svg></button>
  </div>
  <strong id="tn"></strong><span class="sp"></span>
  <select id="vm" aria-label="Parte di famiglia da visualizzare"><option value="all">Tutta la famiglia</option><option value="desc">Discendenti del riferimento</option><option value="anc">Antenati del riferimento</option></select>
  <button class="ib sb" data-act="srch" aria-label="Cerca persona"><svg class="i"><use href="#i-search"/></svg></button>
  <div class="sw"><svg class="i si"><use href="#i-search"/></svg><input id="q" placeholder="Cerca persona…" autocomplete="off" aria-label="Cerca persona"><button class="ib sx" data-act="srch" aria-label="Chiudi ricerca"><svg class="i"><use href="#i-x"/></svg></button><div id="sr" hidden></div></div>
</header>
<div id="stage">
  <svg id="svg" role="group" aria-label="Albero genealogico. Tab per scorrere le persone, Invio per selezionare, frecce per passare tra i familiari"><g id="vp"></g></svg>
  <div id="empty" hidden>
    <img class="lgi big" src="logo.svg" alt="">
    <h2>Benvenuto in Family Tree</h2><p class="mu">Costruisci il tuo albero genealogico. Come vuoi iniziare?</p>
    <div class="oc">
      <button class="card main" data-act="start"><svg class="i"><use href="#i-plus"/></svg><b>Crea il tuo albero</b><span>Parti da te: ti accompagno passo dopo passo.</span></button>
      <button class="card" data-act="demo"><svg class="i"><use href="#i-tree"/></svg><b>Esplora l’esempio</b><span>Una famiglia inventata per provare ogni funzione. Si elimina con un clic.</span></button>
    </div>
    <p class="pv2"><svg class="i"><use href="#i-lock"/></svg>I dati restano su questo dispositivo, nel browser. <button class="lk" data-act="privacy">Scopri di più</button></p>
  </div>
  <div id="bn">
    <div id="demo" class="bc dm" hidden><span>Stai esplorando un <b>esempio</b> con dati inventati.</span><button class="pri" data-act="enddemo">Elimina l’esempio e inizia</button></div>
    <div id="tip" class="bc" hidden><span id="tt"></span><button class="ib" data-act="tipx" aria-label="Nascondi suggerimento"><svg class="i"><use href="#i-x"/></svg></button></div>
  </div>
  <aside id="det" role="region" aria-label="Scheda persona" hidden></aside>
  <div id="zc">
    <button class="ib" data-act="zin" title="Zoom avanti" aria-label="Zoom avanti"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="ib" data-act="zout" title="Zoom indietro" aria-label="Zoom indietro"><svg class="i"><use href="#i-minus"/></svg></button>
    <button class="ib" data-act="fit" title="Adatta allo schermo" aria-label="Adatta allo schermo"><svg class="i"><use href="#i-fit"/></svg></button>
  </div>
</div>
</main>

<nav id="tabs" aria-label="Navigazione">
  <button data-act="trees"><svg class="i"><use href="#i-folder"/></svg>Alberi</button>
  <button data-act="stats"><svg class="i"><use href="#i-chart"/></svg>Statistiche</button>
  <button class="fab" data-act="add" aria-label="Aggiungi persona"><svg class="i"><use href="#i-plus"/></svg></button>
  <button data-act="settings"><svg class="i"><use href="#i-sliders"/></svg>Impostazioni</button>
  <button data-act="more"><svg class="i"><use href="#i-menu"/></svg>Altro</button>
</nav>
<div id="live" class="vh" aria-live="polite"></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="script.js"></script></body></html>
